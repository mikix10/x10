[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "x10-catalog"
version = "0.1.0"
description = "Catalog and metadata registry for X10 data sources"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [{ name = "X10 Team" }]
keywords = ["open-data", "catalog", "metadata", "provenance"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Atmospheric Science",
  "Typing :: Typed",
]
dependencies = [
  "pydantic>=2.7.0",
]

[project.urls]
Homepage = "https://github.com/mikix10/x10"
Repository = "https://github.com/mikix10/x10"

[tool.hatch.build.targets.wheel]
packages = ["src/x10_catalog"]
