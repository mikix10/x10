[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "x10-connectors"
version = "0.1.0"
description = "Data connectors for X10"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [{ name = "X10 Team" }]
keywords = ["open-data", "connectors", "ingestion", "ecmwf"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Atmospheric Science",
  "Typing :: Typed",
]
dependencies = [
  "x10-models",
]

[project.optional-dependencies]
# Client officiel du producteur. Optionnel : le noyau doit rester installable
# sans la pile scientifique. Voir la section « Portee » de CLAUDE.md.
ecmwf = [
  "ecmwf-opendata>=0.3.34",
]
# Decodage GRIB2 vers des tableaux maillees. Le connecteur Meteo-France
# telecharge sans cette pile ; il ne decode qu'avec elle.
grib = [
  "cfgrib>=0.9.15",
  "eccodes>=2.49",
  # La distribution `eccodes` ne publie de roue binaire que pour Windows ;
  # ailleurs elle cherche la bibliotheque C du systeme. `eccodeslib` la
  # fournit en roue manylinux et macOS, a la meme version.
  "eccodeslib>=2.49; sys_platform != 'win32'",
  "xarray>=2025.1",
  # Ecriture NetCDF. Roues disponibles pour les trois systemes.
  "netCDF4>=1.7",
]

[tool.uv.sources]
x10-models = { workspace = true }

[project.urls]
Homepage = "https://github.com/mikix10/x10"
Repository = "https://github.com/mikix10/x10"

[tool.hatch.build.targets.wheel]
packages = ["src/x10_connectors"]
