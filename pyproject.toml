[project]
name = "x10-workspace"
version = "0.1.0"
description = "Workspace monorepo pour X10 — données géo-hydro-océano-météo open data"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [{ name = "X10 Team" }]
dependencies = []

[dependency-groups]
dev = [
  "pytest>=8.2",
  "ruff>=0.6",
  "mypy>=1.11",
  "pre-commit>=4.6.2",
  # Pile de decodage GRIB2. Presente en groupe de developpement et non en
  # dependance de paquet : le noyau publie reste installable sans elle, mais
  # l'integration continue doit exercer le decodage, qui est du code metier.
  # Les paquets qui en ont besoin la declarent en extra `grib`.
  "cfgrib>=0.9.15",
  "eccodes>=2.49",
  # La distribution `eccodes` ne publie de roue binaire que pour Windows ;
  # ailleurs elle cherche la bibliotheque C du systeme. `eccodeslib` la
  # fournit en roue manylinux et macOS, a la meme version.
  "eccodeslib>=2.49; sys_platform != 'win32'",
  "xarray>=2025.1",
]

[tool.uv]
package = false
python-preference = "managed"

[tool.uv.workspace]
members = [
  "packages/*",
  "services/*",
]

[tool.pytest.ini_options]
testpaths = ["packages", "services"]
# Les tests reseau sont exclus par defaut : l'integration continue n'a pas a
# dependre d'un service tiers. Les lancer par `uv run pytest -m network`.
addopts = "-q -m 'not network'"
markers = [
  "network: atteint un service distant reel, desactive par defaut",
]
# Avertissement emis par un appel interne de cfgrib a xarray, sur lequel nous
# n'avons pas la main. Filtre nommement plutot que globalement : nos propres
# avertissements doivent rester visibles.
filterwarnings = [
  "ignore:In a future version of xarray the default value for compat:FutureWarning:cfgrib.xarray_store",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN", "RUF"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["ANN"]

[tool.ruff.lint.isort]
known-first-party = [
  "x10_api",
  "x10_catalog",
  "x10_connectors",
  "x10_models",
  "x10_storage",
]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["packages/*/src", "services/*/src"]

# Derogations nommees, limitees aux modules sans marqueur py.typed.
# Verifie le 29/09/2026 : aucune des deux distributions n'en fournit.
[[tool.mypy.overrides]]
module = ["ecmwf.opendata.*", "multiurl.*"]
ignore_missing_imports = true

# Liaisons GRIB. `strict` reste entier sur notre code : seule la resolution
# d'import est relachee, module par module, comme le prevoit CLAUDE.md.
[[tool.mypy.overrides]]
module = ["cfgrib.*", "eccodes.*", "gribapi.*"]
ignore_missing_imports = true
