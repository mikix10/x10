[project]
name = "x10-workspace"
version = "0.1.0"
description = "Workspace monorepo pour X10 — données géo-hydro-océano-météo open data"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [{ name = "X10 Team" }]
dependencies = []

[dependency-groups]
dev = [
  "pytest>=8.2",
  "ruff>=0.6",
  "mypy>=1.11",
  "pre-commit>=4.6.2",
  "pytest-cov>=5",
  # Pile de decodage GRIB2. Presente en groupe de developpement et non en
  # dependance de paquet : le noyau publie reste installable sans elle, mais
  # l'integration continue doit exercer le decodage, qui est du code metier.
  # Les paquets qui en ont besoin la declarent en extra `grib`.
  "cfgrib>=0.9.15",
  "eccodes>=2.49",
  # La distribution `eccodes` ne publie de roue binaire que pour Windows ;
  # ailleurs elle cherche la bibliotheque C du systeme. `eccodeslib` la
  # fournit en roue manylinux et macOS, a la meme version.
  "eccodeslib>=2.49; sys_platform != 'win32'",
  "xarray>=2025.1",
  # Ecriture NetCDF. Roues disponibles pour les trois systemes.
  "netCDF4>=1.7",
  # Liaison Python vers UDUNITS-2, avec la bibliotheque C **embarquee** dans
  # la roue. Permet de valider chaque unite emise contre UDUNITS lui-meme au
  # lieu de la comparer a une liste tenue a la main -- verifier plutot
  # qu'affirmer. Developpement seulement : aucun paquet publie n'en depend.
  #
  # BSD-3-Clause, roues pour les trois systemes en ABI stable (une seule roue
  # de 3.11 a 3.13). N'ajoute que `jinja2` et `markupsafe` au graphe, tous
  # deux en Python pur. Pas de roue Linux ARM, sans effet sur notre
  # integration continue qui est en x86-64.
  "cf-units>=3.3",
]

[tool.uv]
package = false
python-preference = "managed"

[tool.uv.workspace]
members = [
  "packages/*",
  "services/*",
]

[tool.pytest.ini_options]
testpaths = ["packages", "services"]
# Les tests reseau sont exclus par defaut : l'integration continue n'a pas a
# dependre d'un service tiers. Les lancer par `uv run pytest -m network`.
addopts = "-q -m 'not network'"
markers = [
  "network: atteint un service distant reel, desactive par defaut",
]
# Avertissement emis par un appel interne de cfgrib a xarray, sur lequel nous
# n'avons pas la main. Filtre nommement plutot que globalement : nos propres
# avertissements doivent rester visibles.
filterwarnings = [
  "ignore:In a future version of xarray the default value for compat:FutureWarning:cfgrib.xarray_store",
  # Emis par le moteur netCDF4 de xarray, hors de notre portee.
  "ignore:Setting the shape on a NumPy array has been deprecated:DeprecationWarning:xarray.backends.netCDF4_",
  # netCDF4 1.7.4 est compile contre un en-tete numpy anterieur a 2.5. Verifie
  # le 08/10/2026 : un aller-retour numerique reste exact au bit pres, c'est
  # donc le faux positif classique de compatibilite ascendante de numpy.
  "ignore:numpy.ndarray size changed:RuntimeWarning",
]

# ---------------------------------------------------------------------------
# Couverture : deux vues depuis une seule mesure.
#
# Celle-ci est la vue **informative** : elle n'exclut rien et affiche le taux
# reel, code reseau compris. Elle ne porte deliberement **aucun** `fail_under`,
# sinon elle deviendrait bloquante et le chiffre honnete serait perdu.
#
# La vue **barriere** vit dans `.coveragerc-offline` : elle ecarte le code que
# seuls les tests `network` exercent, et c'est elle qui porte le seuil. Les
# exclusions de coverage.py s'appliquent au rapport et non a la mesure, donc
# les deux vues se lisent dans le meme fichier de donnees.
# ---------------------------------------------------------------------------
[tool.coverage.run]
# `source_pkgs` et non `source` : vise le paquet installe, qui retrouve seul
# ses sources sous `src/`.
source_pkgs = ["x10_models", "x10_catalog", "x10_connectors", "x10_storage", "x10_api"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN", "RUF"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["ANN"]

[tool.ruff.lint.isort]
known-first-party = [
  "x10_api",
  "x10_catalog",
  "x10_connectors",
  "x10_models",
  "x10_storage",
]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["packages/*/src", "services/*/src"]

# Derogations nommees, limitees aux modules sans marqueur py.typed.
# Verifie le 29/09/2026 : aucune des deux distributions n'en fournit.
[[tool.mypy.overrides]]
module = ["ecmwf.opendata.*", "multiurl.*"]
ignore_missing_imports = true

# Liaisons GRIB. `strict` reste entier sur notre code : seule la resolution
# d'import est relachee, module par module, comme le prevoit CLAUDE.md.
[[tool.mypy.overrides]]
module = ["cfgrib.*", "eccodes.*", "gribapi.*"]
ignore_missing_imports = true
