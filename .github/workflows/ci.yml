name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    # `labeled` et `unlabeled` s'ajoutent aux trois types par defaut, et il
    # faut les ecrire tous : declarer `types:` remplace la liste, il ne la
    # complete pas.
    #
    # Sans eux, l'etiquette `refonte-api` est sans effet sur une demande deja
    # ouverte : etiqueter ne declenche aucune execution, et une relance rejoue
    # la **charge utile d'origine**, capturee avant que l'etiquette existe.
    # L'echappatoire ne servirait donc que la ou on n'en a pas besoin.
    types: [ opened, synchronize, reopened, labeled, unlabeled ]

# Le GITHUB_TOKEN est restreint a la lecture : aucun job de cette CI n'ecrit
# dans le depot. A elargir job par job si un futur workflow en a besoin.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint et typage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-packages --dev --locked

      - name: Ruff (lint)
        run: uv run ruff check .

      - name: Ruff (format)
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy

  signatures:
    # Le ruleset exige `required_signatures`, et cette exigence est aujourd'hui
    # SANS EFFET sous fusion par squash : GitHub cree alors un commit nouveau
    # et le signe de sa propre cle. C'est le seul commit que la regle examine,
    # et il est signe par construction — quoi qu'ait contenu la branche.
    #
    # Ce job examine les commits de la demande eux-memes. Il ne fait qu'un
    # appel d'API : ni depot a recuperer, ni dependance a installer, donc
    # aucun jeton laisse dans un `.git/config`.
    #
    # Verifie le 12/10/2026 : les commits de Dependabot sont signes par
    # GitHub et passent ; les notres le sont en SSH.
    name: Signatures des commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Tous les commits de la demande sont signes et verifies
        env:
          GH_TOKEN: ${{ github.token }}
          DEPOT: ${{ github.repository }}
          DEMANDE: ${{ github.event.pull_request.number }}
        run: |
          non_verifies=$(gh api --paginate "repos/$DEPOT/pulls/$DEMANDE/commits" \
            --jq '.[] | select(.commit.verification.verified | not)
                      | "\(.sha[0:7])  \(.commit.verification.reason)"')
          if [ -n "$non_verifies" ]; then
            echo "::error::Commits non signes ou non verifies :"
            echo "$non_verifies"
            exit 1
          fi
          echo "Tous les commits de la demande sont signes et verifies."

  test:
    # Python 3.12 est la cible supportée et bloque la CI.
    # Python 3.13 est un canari de compatibilité ascendante : il ne bloque pas.
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.12"
            experimental: false
          - python-version: "3.13"
            experimental: true

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-packages --dev --frozen

      - name: Run tests with coverage
        run: uv run pytest --cov --cov-report=term-missing:skip-covered --cov-report=html

      # Vue « barriere » : le seuil ne porte que sur le code atteignable hors
      # ligne, le code reseau etant exerce par les tests marques `network` que
      # la suite par defaut exclut. Le rapport ci-dessus reste le taux reel,
      # non filtre — l'ecart doit se voir.
      - name: Coverage gate, offline-reachable code
        run: uv run coverage report --rcfile=.coveragerc-offline

      - name: Upload coverage report
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-html
          path: htmlcov/

  anterieurs:
    # Les tests de `main`, rejoues contre le code propose.
    #
    # La regression a l'infini du « qui garde les gardiens » n'a qu'une
    # sortie connue : celui qui propose un changement ecrit les nouveaux
    # tests, il n'ecrit pas les anciens. Un test affaibli ou vide de sa
    # substance sans changer de nom echoue donc ici, la ou l'inventaire
    # commite ne verrait rien.
    #
    # **Ce job doit figurer aux verifications obligatoires**, et c'est ce qui
    # le protege : un contexte requis sans job correspondant bloque la fusion
    # definitivement. Le retirer du workflow est donc auto-destructeur.
    #
    # Seul le **code** des tests est restaure, jamais les fichiers de
    # reference : une demande qui ajoute legitimement du vocabulaire public
    # ferait sinon echouer le job a chaque fois, et un job qui crie toujours
    # est un job qu'on desactive.
    name: Tests de la base
    runs-on: ubuntu-latest
    # Le job s'execute **toujours**, et c'est l'etape qui se conditionne. Un
    # job escamote par `if:` rapporte « skipped », et un contexte requis qui
    # ne rapporte pas un succes franc bloquerait la fusion -- l'echappatoire
    # deviendrait un piege. Ici le job conclut toujours en succes, et seule
    # l'execution des tests depend de l'etiquette.
    #
    # L'etiquette n'agit que parce que le declencheur porte `labeled` :
    # voir le bloc `on:` en tete de fichier.

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --all-packages --dev --frozen

      # Le code des tests de la base ecrase celui de la demande. Les `.txt`
      # de reference restent ceux de la demande, voir le commentaire du job.
      #
      # `git checkout <ref> -- <chemins>` ne **supprime pas** un fichier absent
      # de la reference : un fichier de tests ajoute par la demande reste donc
      # en place, et c'est voulu -- il eprouve le code qu'elle apporte.
      - name: Restore base test code
        if: >-
          github.event_name == 'pull_request' &&
          !contains(github.event.pull_request.labels.*.name, 'refonte-api')
        run: |
          git checkout "origin/${{ github.base_ref }}" -- \
            'packages/*/tests/*.py' 'services/*/tests/*.py' 'workspace-tests/*.py'
          git status --short

      # L'inventaire des tests est **sans objet ici**, et echouerait sur toute
      # demande qui ajoute un test. Ce job execute un ensemble hybride -- code
      # de la base pour les fichiers existants, fichiers neufs de la demande --
      # qui ne correspond a l'inventaire d'aucun des deux cotes. Le comparer
      # ne dirait rien du code propose, et transformerait l'ajout d'un test en
      # echec. Les autres references, derivees des `src/`, restent coherentes
      # avec la demande et sont donc verifiees normalement.
      - name: Run base tests against proposed code
        if: >-
          github.event_name == 'pull_request' &&
          !contains(github.event.pull_request.labels.*.name, 'refonte-api')
        run: >-
          uv run pytest -q --deselect
          workspace-tests/test_inventaire.py::test_l_inventaire_des_tests_est_celui_de_la_reference

      # Le job conclut quand meme en succes, pour que le contexte requis
      # soit rapporte. Sans cette etape il n'y aurait rien a executer.
      - name: Base tests skipped by label
        if: contains(github.event.pull_request.labels.*.name, 'refonte-api')
        run: echo "Label refonte-api set, base tests deliberately skipped."


  instructions:
    # Les fichiers qui gouvernent l'assistant, proteges comme tels.
    #
    # `CLAUDE.md` et `.claude/` ne sont pas de la documentation : ils sont lus
    # a chaque session et presentes comme des consignes a appliquer. Une ligne
    # ajoutee la change le comportement de l'assistant sur toutes les sessions
    # suivantes -- et elle le change **sans qu'il puisse s'en apercevoir**. Il
    # voit l'etat courant du fichier, jamais son historique : il ne sait donc
    # pas distinguer une decision authentique d'une decision forgee, et sa
    # resistance depend du caractere flagrant de l'instruction, pas de son
    # authenticite. Une ligne plausible, datee, redigee dans le style des
    # quatre-vingt-quinze autres, serait appliquee sans etre mise en doute.
    #
    # Le depot est public : n'importe qui peut proposer une telle ligne. Ce
    # job la rend impossible a fusionner par inadvertance. Il echoue des que
    # ces fichiers different de la base, et seule une etiquette le contourne
    # -- or **poser une etiquette demande le droit d'ecriture**, qu'un
    # contributeur exterieur n'a pas. C'est la meme frontiere d'autorisation
    # que celle du job « Tests de la base », et pour la meme raison.
    #
    # **Ce job doit figurer aux verifications obligatoires**, sans quoi il
    # n'empeche rien : un contexte non requis se fusionne rouge. Et c'est ce
    # qui le protege a son tour -- un contexte requis sans job correspondant
    # bloque la fusion definitivement, donc le retirer du workflow est
    # auto-destructeur.
    #
    # Sa limite, a connaitre plutot qu'a ignorer : il protege d'une fusion
    # **inapercue**, pas d'une relecture escamotee. La regression du « qui
    # garde les gardiens » ne se ferme pas, elle se raccourcit jusqu'au point
    # ou quelqu'un doit lire.
    name: Instructions d'agent
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # `git diff` contre la base, et non contre un condensat enregistre : une
      # reference commitee serait modifiable par la meme demande, donc sans
      # valeur. La base, elle, n'est pas a portee de la demande.
      #
      # La reference passe par `env:` et non par interpolation directe dans le
      # shell : une valeur de contexte inseree dans un `run:` est substituee
      # **avant** que le shell ne lise la ligne, ce qui en fait du code. Le
      # risque est nul ici -- une demande ne peut viser qu'une branche qui
      # existe deja chez nous -- mais la forme sure coute deux lignes, et un
      # job de securite n'a pas a porter le motif qu'il faudrait relever
      # ailleurs.
      #
      # La liste est **fermee, et plus large que ce que le depot contient**.
      # Deposer un fichier d'instruction neuf est aussi efficace que modifier
      # celui qui existe : plusieurs outils d'agent lisent d'autres noms, et
      # un fichier absent aujourd'hui peut etre ajoute par la demande
      # elle-meme. `git diff` accepte sans broncher un chemin absent des deux
      # cotes, donc couvrir une convention que nous n'employons pas ne coute
      # rien -- et fermer la classe plutot que le cas est la regle du depot.
      # A completer le jour ou une convention nouvelle apparait.
      - name: Compare agent instructions with the base
        if: >-
          github.event_name == 'pull_request' &&
          !contains(github.event.pull_request.labels.*.name, 'revision-instructions')
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          SURFACE=(
            CLAUDE.md CLAUDE.local.md AGENTS.md GEMINI.md
            .claude/ .cursor/ .cursorrules .windsurfrules
            .github/copilot-instructions.md .mcp.json
          )
          if git diff --quiet "origin/$BASE_REF" -- "${SURFACE[@]}"; then
            echo "Les fichiers d'instruction d'agent sont identiques a la base."
          else
            git diff --stat "origin/$BASE_REF" -- "${SURFACE[@]}"
            echo "::error::Les fichiers d'instruction de l'assistant different de la base.           Relisez le diff ci-dessus ligne a ligne. Si le changement est voulu, posez           l'etiquette revision-instructions -- ce qui demande le droit d'ecriture."
            exit 1
          fi

      # Le job conclut quand meme en succes, pour que le contexte requis soit
      # rapporte. Sans cette etape, une demande etiquetee n'aurait rien a
      # executer et le contexte resterait muet.
      - name: Comparison skipped by label
        if: contains(github.event.pull_request.labels.*.name, 'revision-instructions')
        run: >-
          echo "Label revision-instructions set, the change to the agent
          instructions is deliberate."

      - name: Nothing to compare outside a pull request
        if: github.event_name != 'pull_request'
        run: echo "Push event, no base to compare against."


  portability:
    # Windows et macOS ne sont pas la plateforme de reference, mais une
    # bibliotheque publiee sur PyPI s'installe partout. Les pieges sont reels
    # et silencieux : les noms de fichiers distants portent des deux-points,
    # que Windows refuse, et la bibliotheque C d'ecCodes n'est embarquee dans
    # la roue Python que sous Windows.
    #
    # 3.12 est bloquant une fois les contextes ajoutes au ruleset ; 3.13 reste
    # un canari, comme sur la plateforme de reference.
    name: Portabilite (Python ${{ matrix.python-version }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        # Combinaisons explicites : avec `os` en cle de matrice et les
        # versions en `include`, GitHub appliquerait chaque entree a toutes
        # les combinaisons et la derniere l'emporterait — deux jobs au lieu
        # de quatre, sans que rien ne le signale.
        include:
          - os: windows-latest
            python-version: "3.12"
            experimental: false
          - os: macos-latest
            python-version: "3.12"
            experimental: false
          - os: windows-latest
            python-version: "3.13"
            experimental: true
          - os: macos-latest
            python-version: "3.13"
            experimental: true

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-packages --dev --frozen

      - name: Run tests
        run: uv run pytest

  build:
    name: Build des packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true

      - name: Build
        run: uv build --all-packages

      # Valide les metadonnees que PyPI refuserait a la publication. Les
      # verifier ici evite de decouvrir le defaut au moment de publier.
      - name: Check distribution metadata
        run: uv run --with twine --no-project twine check dist/*

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
