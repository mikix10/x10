name: CodeQL

# Analyse statique de securite. Separee de la CI parce qu'elle n'a pas le
# meme rythme ni les memes droits : elle ecrit dans l'onglet Security, la ou
# aucun job de la CI n'ecrit quoi que ce soit.
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    # Un passage hebdomadaire attrape ce qu'un depot calme ne declenche pas :
    # une regle nouvelle s'applique alors au code existant, sans qu'il ait
    # fallu y toucher.
    - cron: "17 4 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyse:
    name: Analyse ${{ matrix.language }}
    runs-on: ubuntu-latest
    permissions:
      # Elargi **job par job**, selon la regle posee dans ci.yml.
      security-events: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # `actions` analyse les workflows eux-memes : droits trop larges,
        # injection par `${{ }}`, action non epinglee. Le depot epingle par
        # empreinte et restreint son jeton ; autant le faire verifier.
        language: [ python, actions ]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialiser CodeQL
        uses: github/codeql-action/init@d208ec71e39ae46397cbf6569bef8439b9aab974 # codeql-bundle-v2.27.2
        with:
          languages: ${{ matrix.language }}
          # `security-and-quality` ajoute aux regles de securite celles de
          # qualite. Nos portes couvrent deja le style ; ce qui nous
          # interesse ici est ce que ruff et mypy ne voient pas.
          queries: security-and-quality

      # Pas d'etape de compilation : Python est interprete, et les workflows
      # ne se compilent pas. `autobuild` serait sans objet.
      - name: Analyser
        uses: github/codeql-action/analyze@d208ec71e39ae46397cbf6569bef8439b9aab974 # codeql-bundle-v2.27.2
        with:
          category: /language:${{ matrix.language }}
